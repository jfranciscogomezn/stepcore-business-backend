spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stepcore_security}
    username: ${DB_APP_USER:stepcore_app}
    password: ${DB_APP_PASSWORD:stepcore_app_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    user: ${DB_USER:gmm_user}
    password: ${DB_PASSWORD:gmm_pass}
    locations: classpath:db/migration
    table: flyway_schema_history_business
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8081}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:stepcore-security-super-secret-key-change-in-production-min-256-bits}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app:
  notifications:
    email-from: ${NOTIFICATION_EMAIL_FROM:noreply@stepcore.local}
    jdbc-admin-lookup-enabled: ${NOTIFICATION_JDBC_LOOKUP:true}
    fallback-admin-emails: ${NOTIFICATION_FALLBACK_ADMIN_EMAILS:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.stepcore.business: INFO
    org.springframework.security: WARN
