spring:
  datasource:
    url: jdbc:tc:postgresql:15:///stepcore_business_test?TC_REUSABLE=true
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_business

jwt:
  secret: test-secret-key-for-unit-tests-only-not-for-production-use

logging:
  level:
    com.stepcore.business: DEBUG
    org.springframework.security: WARN
